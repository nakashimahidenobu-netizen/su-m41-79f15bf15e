const startDate=()=>{const v=store.get('su30_start_date',null);if(v)return v;const d=fmtDate(new Date());store.set('su30_start_date',d);return d};
function localDate(s){const p=String(s).split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function fmtDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateForDay(day){const d=localDate(startDate());d.setDate(d.getDate()+Number(day)-1);return fmtDate(d)}
function projectDay(){const t=new Date();t.setHours(0,0,0,0);const d=Math.floor((t-localDate(startDate()))/86400000)+1;return Math.max(1,Math.min(APP_SPEC.totalDays,d))}

function syncPeriod(){state.day=Math.max(1,Math.min(maxDay(),Number(state.day)||1));if(state.day>900){state.year=4;state.set=1}else{state.year=Math.floor((state.day-1)/300)+1;state.set=Math.floor(((state.day-1)%300)/100)+1}}
function blockStart(year=state.year,set=state.set){return year===4?901:(year-1)*300+(set-1)*100+1}
function chooseYear(year){if(mode()!=='member')return;state.year=Number(year);state.set=1;state.day=blockStart();render()}
function chooseSet(set){if(mode()!=='member'||state.year===4)return;state.set=Number(set);state.day=blockStart();render()}
function chooseDay(day){state.day=Number(day);syncPeriod();render()}
function clearTimer(){if(state.tm){clearInterval(state.tm);state.tm=null}}
function go(t){clearTimer();if(state.pr&&state.pr.ph===1)state.pr.ph=0;state.tab=t;render();scrollTo(0,0)}

function speak(t,rate=.88){if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate;speechSynthesis.cancel();speechSynthesis.speak(u)}
function sayId(id,w){const x=byId(id);if(!x)return;if(w==='prompt')speak(x.prompt_en,1);else speak(x.en)}
function sayChunk(id,i){const x=byId(id);if(x&&x.items[i]!==undefined)speak(x.items[i],.8)}
function review(){return store.get('su25_review',{})}
function srsOf(kind,id){const L=store.get(LOG[kind],{});if(L[id])return L[id];if(kind==='recall'){const r=review()[id];if(r&&r.date){const step=r.pass?Math.min(r.count||1,5):0;return {step,due:addDays(r.date,r.pass?INT[Math.max(step,1)-1]:1),last:r.date,n:r.count||1,legacy:true}}}return null}
function markSrs(kind,id,pass){const L=store.get(LOG[kind],{}),o=srsOf(kind,id)||{step:0,n:0},t=T(),step=pass?Math.min((o.step||0)+1,5):0;L[id]={step,due:addDays(t,pass?INT[step-1]:1),last:t,n:(o.n||0)+1,hist:((L[id]&&L[id].hist)||[]).concat([[t,pass?1:0]]).slice(-12)};store.set(LOG[kind],L)}
function todayDone(kind){const L=store.get(LOG[kind],{}),t=T();return Object.values(L).filter(o=>o.last===t).length}
function poolFor(kind){return introduced().filter(x=>kind==='recall'||x.prompt_en).map(x=>({x,s:srsOf(kind,x.id)}))}
function buildQueue(kind){const t=T(),lim=(kind==='recall'?settings().dailyReview:5)+state.extra[kind],rest=Math.max(0,lim-todayDone(kind)),pool=poolFor(kind);const due=pool.filter(o=>o.s&&o.s.due<=t&&o.s.last!==t).sort((a,b)=>a.s.due<b.s.due?-1:a.s.due>b.s.due?1:b.x.day-a.x.day);const fresh=pool.filter(o=>!o.s).sort((a,b)=>b.x.day-a.x.day||a.x.no-b.x.no);return due.concat(fresh).slice(0,rest).map(o=>o.x.id)}
function counts(kind){const t=T(),pool=poolFor(kind);return {due:pool.filter(o=>o.s&&o.s.due<=t&&o.s.last!==t).length,fresh:pool.filter(o=>!o.s).length,pool:pool.length,todo:buildQueue(kind).length}}
function practiceDates(){const s=new Set();Object.values(LOG).forEach(k=>Object.values(store.get(k,{})).forEach(o=>(o.hist||[]).forEach(h=>s.add(h[0]))));Object.values(review()).forEach(o=>{if(o&&o.date)s.add(o.date)});return s}
function streak(){const s=practiceDates();let d=T(),n=0;if(!s.has(d))d=addDays(d,-1);while(s.has(d)){n++;d=addDays(d,-1)}return n}
function grade(id,pass){markSrs('recall',id,pass);const r=review();r[id]={date:T(),pass,count:(r[id]?.count||0)+1};store.set('su25_review',r);render()}
function locEditor(x){return `<div class="row" style="margin-bottom:8px"><input id="loc-${x.id}" placeholder="あなたの場所（例：机の右側）" style="flex:1;margin:0"><button onclick="saveLoc('${x.id}')">設定</button></div>`}

function card(x,recall=false){const pl=x.plan,hd=(pl||x.daily)?esc(x.chapter_title):'No.'+String(x.no).padStart(2,'0')+'｜'+esc(x.chapter_title);return `<div class="card"><div class="kicker">Day${x.day}｜${hd} <span class="pill">${esc(x.category)}</span>${pl?' <span class="pill pl">仮案</span>':''}${x.aiSupplement?' <span class="pill">AI補完</span>':''}</div><h2>${esc(locOf(x))}</h2>${needLoc(x)?locEditor(x):''}${dailyContext(x)}${x.prompt_en?`<div class="small">受け：<span class="blur" onclick="this.classList.toggle('show')">${esc(x.prompt_en)}</span>（${esc(x.prompt_ja)}）</div><div class="small">崩れ：<span class="snd">${esc(x.sound)}</span>　${esc(x.sound_note)}</div>`:''}${x.items.map((v,i)=>`<div class="item">${i+1}. ${esc(v)}</div>`).join('')}<div class="en ${recall?'blur':''}" onclick="this.classList.toggle('show')">${esc(x.en)}</div><div class="ja">${esc(x.ja)}</div><div class="row" style="margin-top:8px"><button class="primary" onclick="sayId('${x.id}')">音読</button><button class="ok" onclick="grade('${x.id}',true)">◯ 言えた</button><button class="bad" onclick="grade('${x.id}',false)">✕ 未想起</button></div></div>`}

function vList(){syncPeriod();const member=mode()==='member',start=member?blockStart():1,end=member?start+99:maxDay(),xs=visible().filter(x=>x.day>=start&&x.day<=end);return periodSelector()+`<div class="card"><div class="kicker">英文一覧</div><h2>Day${start}〜${end}｜${xs.length}英文</h2><div class="small">各カードの「地点名」欄に、あなたの場所を登録すると、想起の手がかりになります。</div></div>`+(xs.length?xs.map(x=>card(x)).join(''):'<div class="empty">このセットの英文はまだありません。</div>')}

function endPractice(){clearTimer();state.pr=null;render()}

function startLearn(day){clearTimer();state.pr={kind:'learn',day:Number(day),q:byDay(day).map(x=>x.id),i:0,ls:0,ci:0,n:0,ok:0,st:0,ph:0};state.tab='recall';render();scrollTo(0,0)}
function lNext(){const p=state.pr,x=p&&byId(p.q[p.i]);if(!x)return;if(p.ls===0){p.ls=1;p.ci=0}else if(p.ls===1){if(p.ci<x.items.length-1)p.ci++;else p.ls=2}else if(p.ls===2){p.ls=3}else{p.n++;p.i++;p.ls=0;p.ci=0}render();scrollTo(0,0)}
function lPrev(){const p=state.pr,x=p&&byId(p.q[p.i]);if(!x)return;if(p.ls===3)p.ls=2;else if(p.ls===2){p.ls=1;p.ci=x.items.length-1}else if(p.ls===1){if(p.ci>0)p.ci--;else p.ls=0}render();scrollTo(0,0)}
function vLearnCard(p,x){const n=x.items.length,steps=['① 意味','② チャンク','③ 全文','④ 仕上げ'],bar=steps.map((s,i)=>`<span class="pill ${i===p.ls?'':'pl'}" style="${i===p.ls?'':'opacity:.55'}">${s}</span>`).join(' ');const head=`<div class="kicker">学ぶ ${p.i+1} / ${p.q.length}｜Day${x.day} <span class="pill">${esc(x.category)}</span></div><div class="row" style="margin-bottom:8px">${bar}</div><h2>${esc(locOf(x))}</h2>`;let body='';if(p.ls===0){body=`<div class="small">まず、日本語で意味をつかみます。</div><div class="ja" style="font-size:16px;margin:10px 0">${esc(x.ja)}</div><div class="small">意味が頭に入ったら、次へ。英文はまだ見ません。</div>`}else if(p.ls===1){const shown=x.items.slice(0,p.ci+1);body=`<div class="ja">${esc(x.ja)}</div><div class="small" style="margin-top:8px">チャンク ${p.ci+1} / ${n}：意味のかたまりごとに、声に出します。</div>`+shown.map((v,i)=>`<div class="item" style="${i===p.ci?'':'opacity:.6'}">${i+1}. ${esc(v)}</div>`).join('')+`<div class="row" style="margin-top:8px"><button class="primary" onclick="sayChunk('${x.id}',${p.ci})">🔊 このチャンクを聞く</button></div>`}else if(p.ls===2){body=`<div class="ja">${esc(x.ja)}</div>`+x.items.map((v,i)=>`<div class="item">${i+1}. ${esc(v)}</div>`).join('')+`<div class="small" style="margin-top:8px">チャンクをつなげて、最後まで通して言います。</div><div class="en">${esc(x.en)}</div><div class="row"><button class="primary" onclick="sayId('${x.id}')">🔊 全文を聞く</button></div>`}else{body=`<div class="en">${esc(x.en)}</div><div class="ja">${esc(x.ja)}</div>`+(x.prompt_en?`<div class="small" style="margin-top:8px">受け：${esc(x.prompt_en)}（${esc(x.prompt_ja)}）</div><div class="small">崩れ：<span class="snd">${esc(x.sound)}</span>　${esc(x.sound_note)}</div>`:'')+`<div class="small" style="margin-top:8px">${x.category==='DAILY LIFE'?'実際の場面に合わせて、自分の言葉に言い換えてみましょう。':'語彙や音で引っかかったところを、もう一度声に出して確認します。'}</div><div class="row" style="margin-top:8px"><button class="primary" onclick="sayId('${x.id}')">🔊 全文を聞く</button></div>`}const nextLabel=p.ls===0?'次へ：チャンクで言う':p.ls===1?(p.ci<n-1?'次のチャンクへ':'全文へ'):p.ls===2?'仕上げへ':(p.i<p.q.length-1?'次の英文へ':'完了');return `<div class="card">${head}${dailyContext(x)}${body}<div class="row" style="margin-top:12px">${p.ls>0?'<button onclick="lPrev()">← 戻る</button>':''}<button class="ok" onclick="lNext()">${nextLabel}</button><button onclick="endPractice()">やめる</button></div></div>`}

function vPracticeHome(){const c=counts('recall'),r=counts('resp');return `<div class="card"><div class="kicker">学ぶ｜意味 → チャンク → 全文</div><h2>Day${state.day}の英文を、順番に身につける</h2><div class="small">① 日本語で意味を確認 ② 意味のかたまり（チャンク）ごとに声に出す ③ 最後に全文を通す ④ 語彙・音の崩れを確認</div><div class="row" style="margin-top:10px"><button class="primary" onclick="startLearn(${state.day})">Day${state.day}を学ぶ</button></div></div><div class="card"><div class="kicker">今日の練習</div><h2>思い出す → 話す → 忘れる前にもう一度</h2><div class="journal-summary"><div><div class="metric">${c.todo}</div><div class="small">今日の復習（期限 ${c.due}件・未復習 ${c.fresh}件のうち上限まで）</div></div><div><div class="metric">${streak()}日</div><div class="small">連続練習日数</div></div></div><div class="small" style="margin-top:8px">気が向いた日だけでOK。休んだ分は期限切れとして次回に出ますが、1日の上限（仕様タブで変更）を超えては出ません。これまでに作った英文も、すべて復習の対象です。</div><div class="row" style="margin-top:10px"><button class="primary" onclick="startPractice('recall')">復習をはじめる（想起）</button></div></div><div class="card"><div class="kicker">Response｜受けて、3秒で返す</div><h2>相手の英文を聞いて、自力で返す</h2><div class="metric">${r.todo}</div><div class="small">今日の返答練習（受け英文つきの${r.pool}本が対象${r.pool?'':'。「任意登録」で受け英文を入れると使えます'}）</div><div class="row" style="margin-top:10px"><button class="primary" onclick="startPractice('resp')">Responseをはじめる</button></div></div><div class="small">端末の合成音声は、崩れた発音までは再現しません。音の崩れは、カード上の表記で確認してください。</div>`}
function vPracticeEnd(p){const more=p.kind==='recall'?'復習':'返答練習';return `<div class="card"><div class="kicker">${p.kind==='recall'?'復習':'Response'}｜おつかれさまでした</div><h2>${p.n?p.ok+' / '+p.n+' 言えました':'今日の分はすべて終わりました'}</h2><div class="small">できなかった分は、明日また出ます。できた分は、間隔をあけて戻ってきます。</div><div class="row" style="margin-top:10px"><button class="primary" onclick="morePractice('${p.kind}')">あと5件、${more}をつづける</button><button onclick="endPractice()">ホームへ</button></div></div>`}
function vRecallCard(p,x){const st=p.st;return `<div class="card"><div class="kicker">復習 ${p.i+1} / ${p.q.length}｜Day${x.day} <span class="pill">${esc(x.category)}</span></div><h2>${esc(locOf(x))}</h2>${needLoc(x)?locEditor(x):''}<div class="small">場所から、英文を思い出してください。</div>${st>=1?`<div class="ja" style="margin-top:8px">${esc(x.ja)}</div>`:''}${st>=2?x.items.map((v,i)=>`<div class="item">${i+1}. ${esc(v)}</div>`).join(''):''}${st>=3?`<div class="en">${esc(x.en)}</div><div class="row"><button class="primary" onclick="sayId('${x.id}')">音読</button></div>`:''}<div class="row" style="margin-top:10px">${st<3?`<button onclick="hint()">ヒント（${['意味（日本語）','チャンク','全文'][st]}）</button><button onclick="reveal()">答えを見る</button>`:''}<button class="ok" onclick="answer(true)">◯ 言えた</button><button class="bad" onclick="answer(false)">✕ 言えない</button></div><div class="row" style="margin-top:8px"><button onclick="endPractice()">やめる</button></div></div>`}
function vRespCard(p,x){const head=`<div class="kicker">Response ${p.i+1} / ${p.q.length}｜Day${x.day}</div>`;if(p.ph===0)return `<div class="card">${head}<h2>相手の英文を聞いて、3秒で返す</h2><div class="row"><button class="primary" onclick="sayId('${x.id}','prompt')">▶ 相手の英文を聞く</button></div><div class="small" style="margin-top:8px">文字：<span class="blur" onclick="this.classList.toggle('show')">${esc(x.prompt_en)}</span></div><div class="row" style="margin-top:10px"><button class="ok" onclick="startCount()">⏱ 3秒で返す</button><button onclick="endPractice()">やめる</button></div></div>`;if(p.ph===1)return `<div class="card">${head}<div class="cd" id="cd">3</div><div class="small" style="text-align:center">声に出して返しましょう</div><div class="row" style="justify-content:center;margin-top:10px"><button onclick="showAns()">答えを見る</button></div></div>`;return `<div class="card">${head}<div class="small">返答例</div><div class="en">${esc(x.en)}</div><div class="ja">${esc(x.ja)}</div><div class="small" style="margin-top:8px">受け：${esc(x.prompt_en)}（${esc(x.prompt_ja)}）</div><div class="small">崩れ：<span class="snd">${esc(x.sound)}</span>　${esc(x.sound_note)}</div><div class="row" style="margin-top:8px"><button class="primary" onclick="sayId('${x.id}')">返答を音読</button><button onclick="sayId('${x.id}','prompt')">受けをもう一度</button></div><div class="row" style="margin-top:10px"><button class="ok" onclick="answer(true)">◯ 返せた</button><button class="bad" onclick="answer(false)">✕ 返せなかった</button></div></div>`}
function vRecall(){const p=state.pr;if(!p)return vPracticeHome();const endV=()=>p.kind==='learn'?vLearnEnd(p):vPracticeEnd(p);const id=p.q[p.i];if(!id)return endV();const x=byId(id);if(!x)return endV();return p.kind==='learn'?vLearnCard(p,x):p.kind==='recall'?vRecallCard(p,x):vRespCard(p,x)}
function vProgress(){const r=review(),xs=introduced(),done=xs.filter(x=>r[x.id]?.pass).length,p=Math.round(done/xs.length*100)||0,jc=Object.keys(journals()).length,seen=xs.filter(x=>srsOf('recall',x.id)).length;return `<div class="card"><div class="kicker">約1000日の歩みをBlueprintへつなぐ</div><div class="journal-summary"><div><div class="metric">${done} / ${xs.length}</div><div class="small">言えた英文 ${p}%（導入済み）</div></div><div><div class="metric">${seen} / ${xs.length}</div><div class="small">一度でも復習した英文</div></div><div><div class="metric">${streak()}日</div><div class="small">連続練習日数</div></div><div><div class="metric">${jc}日</div><div class="small">感謝ノート記録</div></div></div><div class="bar" style="margin-top:12px"><div style="width:${p}%"></div></div></div><div class="card"><table><tr><th>Day</th><th>No.</th><th>場所</th><th>結果</th><th>次回</th></tr>${xs.map(x=>{const s=srsOf('recall',x.id);return `<tr><td>${x.day}</td><td>${x.plan?'仮':x.no}</td><td>${esc(locOf(x))}</td><td>${r[x.id]?.pass?'◯':r[x.id]?'✕':'—'}</td><td>${s?s.due.slice(5):'—'}</td></tr>`}).join('')}</table></div>`}
function vCustom(){if(mode()!=='member')return '<div class="card"><h2>本会員版の機能です</h2><div class="small">本会員版ではDay18以降、任意の言葉・英文を所定の場所へ登録できます。</div></div>';const d=Math.max(18,state.day);return '<div class="card"><div class="kicker">Day18〜1000｜任意登録</div><h2>あなたの言葉・英文を場所へ貼る</h2><label>Day（18〜1000）</label><input id="cday" type="number" min="18" max="1000" value="'+d+'"><label>カテゴリ</label><select id="ccat"><option>VISION</option><option>BUSINESS／文化</option><option>DAILY LIFE</option></select><label>場所</label><input id="cloc" placeholder="あなたが決めた場所（例：自宅の机の右側）"><label>日本語</label><textarea id="cja"></textarea><label>英文</label><textarea id="cen"></textarea><label>想起アイテム／自然な意味チャンク（1行1個・個数固定なし）</label><textarea id="citems" placeholder="meaning chunk 1&#10;meaning chunk 2"></textarea><details style="margin-top:10px"><summary>Response練習用（任意）：相手の英文と音の崩れ</summary><label>受け英文（相手が言う英文）</label><input id="cpen"><label>受け英文の日本語</label><input id="cpja"><label>返答の音の崩れ表記（任意）</label><input id="csnd"><label>音の崩れのメモ（任意）</label><input id="csnote"></details><button class="primary" onclick="addCustom()">登録する</button><div id="err" class="small" style="color:var(--red)"></div><div class="danger-note">英文・場所は、ご自身で作ったもの（または利用する権利のあるもの）を登録してください。</div></div>'+custom().map(x=>card(x)+'<button class="bad" style="margin:-6px 0 14px 14px" onclick="delCustom(\''+x.id+'\')">削除</button>').join('')}
function addCustom(){const items=document.getElementById('citems').value.split(/\n/).map(x=>x.trim()).filter(Boolean),d=Number(document.getElementById('cday').value),loc=document.getElementById('cloc').value.trim(),en=document.getElementById('cen').value.trim();if(!(d>=18)||d>APP_SPEC.totalDays||!loc||!en||items.length<1){document.getElementById('err').textContent='Day18〜1000、場所、英文、1個以上の自然な意味チャンクを入力してください。';return}const a=custom(),no=1000+a.length+1,o={id:'CU-'+Date.now(),no,day:d,phase:'CUSTOM',category:document.getElementById('ccat').value,chapter:0,chapter_title:'My Words',area:'My Words',location:loc,ja:document.getElementById('cja').value,en,items,created:fmtDate(new Date())},pen=document.getElementById('cpen').value.trim();if(pen){o.prompt_en=pen;o.prompt_ja=document.getElementById('cpja').value.trim();o.sound=document.getElementById('csnd').value.trim();o.sound_note=document.getElementById('csnote').value.trim()}a.push(o);store.set('su25_custom',a);state.day=d;syncPeriod();render()}
function delCustom(id){store.set('su25_custom',custom().filter(x=>x.id!==id));render()}
function saveStartDate(){const v=document.getElementById('startdate').value;if(!v)return;store.set('su30_start_date',v);goToday()}
function setQuota(v){const s=settings();s.dailyReview=Number(v);store.set('su31_settings',s);render()}
function vSettings(){return `<div class="card"><div class="kicker">SpeakUp モニター版 v41M</div><h2>BlueprintからDayまでを一つにつなぐ</h2><div class="item">3カ年Blueprint → 各1カ年目標 → 100日×3セット → 各Day</div><div class="item">Day1〜900の3カ年実践 → Day901〜1000の統合100日</div><div class="item">各Day → 感謝ノート／My Journal</div><div class="item">1地点＝1完結英文。チャンク・想起アイテム数は固定しない</div><div class="item">収録内容：Day1〜17は「英語の成功脳」の英文52本。場所は、あなた自身で登録します（各カードの「地点名」欄）。Day18以降は空です。「任意登録」から、あなた自身の言葉・英文を追加できます</div><div class="item">英文練習の基本順（学ぶ）：意味（日本語）→ チャンクごとに発話 → 全文 → 語彙・音の崩れ</div><div class="item">練習：Recall（場所→日本語→キーワード→英文）／Response（3秒で返す。任意登録で受け英文を入れると対象になります）／間隔復習（1・3・7・14・30日）</div><div class="item">記憶する → 言葉にする → 行動する → 記録する → コンテキストが育つ → Blueprintへ戻す</div></div><div class="card"><div class="kicker">1日の復習の上限</div><select onchange="setQuota(this.value)">${[5,10,15,20].map(n=>`<option value="${n}" ${settings().dailyReview===n?'selected':''}>${n}件</option>`).join('')}</select><div class="small">既存の英文もすべて復習対象です。期限が来たものから、未復習は新しい日のものから順に出ます。</div></div><div class="card"><div class="kicker">プロジェクト開始日</div><label>Day1の日付</label><input id="startdate" type="date" value="${startDate()}"><button onclick="saveStartDate()">開始日を保存して今日へ</button><div class="small">初めて開いた日が自動でDay1になります。別の日から始めたい場合は、ここで変更してください。</div></div><div class="card"><div class="kicker">表示モード</div><select onchange="store.set('su25_mode',this.value);state.day=1;syncPeriod();render()"><option value="member" ${mode()==='member'?'selected':''}>本会員版（全Day）</option><option value="trial17" ${mode()==='trial17'?'selected':''}>17日試用版</option><option value="trial7" ${mode()==='trial7'?'selected':''}>1週間試用版</option></select><div class="small">表示確認用の切り替えです。</div></div><div class="card"><div class="kicker">記録の保存場所</div><div class="small">復習・感謝ノート・Blueprint・任意登録は、この端末のブラウザ内に保存されます。端末やブラウザを変えると引き継がれません。Blueprintタブの「記録を出力」で、JSONとして書き出せます。</div></div>`}
function render(){syncPeriod();document.getElementById('tabs').innerHTML=tabs.map(([k,v])=>'<button class="tab '+(state.tab===k?'active':'')+'" onclick="go(\''+k+'\')">'+v+'</button>').join('');const f=({blueprint:vBlueprint,today:vToday,journal:vJournal,list:vList,recall:vRecall,progress:vProgress,custom:vCustom,settings:vSettings})[state.tab]||vToday;document.getElementById('app').innerHTML=f()}
const PROJECT_DEFAULTS={threeYear:'',years:{'1':'','2':'','3':'','4':''},sets:{},updatedAt:''};
function projectBlueprint(){const b=store.get('su30_blueprint',{});return {threeYear:b.threeYear||PROJECT_DEFAULTS.threeYear,years:Object.assign({},PROJECT_DEFAULTS.years,b.years||{}),sets:Object.assign({},PROJECT_DEFAULTS.sets,b.sets||{}),updatedAt:b.updatedAt||''}}
function projectComparison(edit=false){const b=blueprint(),j=journalFor(state.day),y=b.years[String(state.year)],s=b.sets[state.year===4?'integration':state.year+'-'+state.set];let h='<div class="card"><div class="kicker">計画と実績｜年 → 100日 → 今日</div><h2>'+esc(y||'1カ年目標は未設定です（Blueprintで設定）')+'</h2><div class="ja">'+esc(s||'この100日の到達状態は未設定です（Blueprintで設定）')+'</div>';
h+='<div class="small" style="margin-top:10px">今日の行動：'+esc(j.plan||'未設定')+'<br>完了条件：'+esc(j.doneCondition||'未設定')+'<br>今日の実績：'+esc(j.action||'未記録')+'<br>判断：'+esc(j.decision||'未記録')+'<br>次の一歩：'+esc(j.next||'未設定')+'</div><div class="row" style="margin-top:10px"><button onclick="go(\'blueprint\')">Blueprintを確認</button><button class="primary" onclick="go(\'journal\')">今日の行動と振り返りを記録</button></div></div>';return h}
function projectAllWeeks(){return '<div class="card"><button onclick="exportProjectReview()">記録を出力（JSON）</button><div class="small">この端末のBlueprint・感謝ノート・復習記録を出力できます。保存はこの端末内のみで、自動では同期されません。</div></div>'}
function exportProjectReview(){const value={format:'SpeakUp monitor export',exportedAt:new Date().toISOString(),blueprint:blueprint(),journal:journals(),custom:custom(),places:locMap(),review:review()},blob=new Blob([JSON.stringify(value,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='SpeakUp-monitor-'+T()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
syncPeriod();render();
</script></body></html>
